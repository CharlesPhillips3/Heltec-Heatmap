; Heltec Heatmap firmware
; Build:  pio run -e heltec_v3   (or heltec_v4)
; Flash:  pio run -e heltec_v3 -t upload

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.10/platform-espressif32.zip
framework = arduino
board = heltec_wifi_lora_32_V3
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps = https://github.com/olikraus/U8g2_Arduino.git#2.35.30

[env:heltec_v3]
board_build.partitions = partitions-8MB.csv
build_flags = -DHELTEC_V3

[env:heltec_v4]
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions-16MB.csv
build_flags = -DHELTEC_V4
